<!DOCTYPE <html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | Lyric (리릭)</title>
</head>
<body>
    <!--Heading for login page-->
    <h2>Login to Lyric</h2>
    <!--Form, POST sned username & password to check-->
    <form method="POST">
        Username: <input type="text" name="username">
        <br>
        Password: <input type="password" name="password">
        <br>
        <button type="submit">Sign In</button>
    </form>
    <!--Jump to register page-->
    <p>New fan?<a href="/user/register">Register here</a></p>
    <!--Back to homepage-->
    <p><a href="/">Back to Home</a></p>
    
</body>
</html>
